# IF-THEN rules: ID, keywords, type, priority, route, human_review, auto_reply
# =============================================================================
# sensitivity_rules.yaml
# Explicit production rules (IF text matches -> THEN escalate) for sensitive
# grievances. Read by src/rules/sensitivity_engine.py.
#
# HOW A RULE WORKS
#   1. The description is lower-cased.
#   2. Every keyword is searched as a whole word / whole phrase.
#   3. If a match overlaps an `exclusions` phrase, THAT match is discarded.
#      (Other occurrences elsewhere in the text still count.)
#   4. Any surviving match fires the rule: priority P1, mandatory human review,
#      no auto-reply, routed to `route_to`. The matched phrase is saved as
#      EVIDENCE and shown on the dashboard.
#   5. A rule firing ALWAYS overrides the classifier.
#
# DESIGN PRINCIPLES
#   * A missed sensitive case is the worst failure -> lean towards flagging.
#   * Risky single words (die, kill, threat, accident) are only used with
#     exclusions or as multi-word phrases, to avoid flooding the welfare team.
#   * Every rule has human_review: true and auto_reply: false. Do not change.
#   * route_to must match a department in routing_table.yaml (tests/test_config.py
#     checks this).
#   * Changing this file = changing policy. Bump `version`, record why in git.
# =============================================================================

version: 1
last_updated: 2026-10-23

# When several rules fire on one message, ALL are recorded as evidence.
# The route and alert level come from the earliest rule in this list.
route_precedence: [R-006, R-005, R-003, R-001, R-002, R-004]

rules:
  # ---------------------------------------------------------------------------
  - id: R-001
    name: Ragging
    type: SAFETY
    priority: P1
    alert_level: urgent
    route_to: Anti-Ragging Cell
    human_review: true
    auto_reply: false
    rationale: Ragging is a legal offence and must reach the Anti-Ragging Cell quickly.
    keywords:
      - ragging
      - ragged
      - bullied by seniors
      - bullying by seniors
      - humiliated by seniors
      - forced by seniors
      - seniors are forcing
      - seniors forced
      - seniors ne dhamki
      - seniors ne force
      - senior ne dhamki
    exclusions:
      - anti-ragging
      - anti ragging
      - antiragging
      - no ragging
      - ragging free
      - ragging-free
      - against ragging
      - ragging awareness
      - ragging policy

  # ---------------------------------------------------------------------------
